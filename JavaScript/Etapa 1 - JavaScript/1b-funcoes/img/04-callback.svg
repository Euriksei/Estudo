<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<rect width="400" height="400" fill="#ffffff"/>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<g font-family="system-ui, sans-serif" font-size="14" fill="#1a1a1a">
<text x="16" y="24" fill="#555">a chamada</text>
<rect x="12" y="34" width="376" height="40" rx="8" fill="#f1f3f8" stroke="#333"/>
<text x="24" y="59" font-family="Consolas, Menlo, monospace" font-size="15">repetir(3, <tspan fill="#1f7a4d" font-weight="bold">mostrar</tspan>)</text>
<text x="210" y="59" fill="#1f7a4d">← sem parênteses</text>
<path d="M120 76 L120 116" stroke="#333" stroke-width="1.5" marker-end="url(#s)"/>
<text x="132" y="102" fill="#333">a função vai como valor para "acao"</text>
<text x="16" y="138" fill="#555">dentro de repetir</text>
<rect x="12" y="148" width="376" height="76" rx="8" fill="#f1f3f8" stroke="#333"/>
<text x="24" y="172" font-family="Consolas, Menlo, monospace" font-size="15">for (let i = 1; i &lt;= 3; i++) {</text>
<text x="48" y="193" font-family="Consolas, Menlo, monospace" font-size="15"><tspan fill="#b00020" font-weight="bold">acao(i)</tspan></text>
<text x="24" y="214" font-family="Consolas, Menlo, monospace" font-size="15">}</text>
<text x="140" y="193" fill="#b00020">← aqui a função é chamada</text>
<text x="16" y="256" fill="#555">cada volta chama mostrar com um número</text>
<g font-family="Consolas, Menlo, monospace" font-size="15">
<rect x="12" y="266" width="376" height="34" rx="6" fill="#ffffff" stroke="#333"/>
<text x="24" y="288">acao(1)  →  mostrar(1)  →  volta 1</text>
<rect x="12" y="306" width="376" height="34" rx="6" fill="#ffffff" stroke="#333"/>
<text x="24" y="328">acao(2)  →  mostrar(2)  →  volta 2</text>
<rect x="12" y="346" width="376" height="34" rx="6" fill="#ffffff" stroke="#333"/>
<text x="24" y="368">acao(3)  →  mostrar(3)  →  volta 3</text>
</g>
</g>
</svg>
